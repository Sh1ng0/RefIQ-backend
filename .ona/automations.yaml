tasks:
  install-dependencies:
    name: Install dependencies
    command: |
      ./platform/mvnw -f platform/pom.xml -DskipTests dependency:go-offline
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build
    command: |
      ./platform/mvnw -f platform/pom.xml -DskipTests package
    dependsOn:
      - install-dependencies
    triggeredBy:
      - manual

services:
  development-stack:
    name: Development stack
    description: Spring Boot API with Postgres, MinIO, and the R engine
    commands:
      start: |
        ona environment port open 8080 --dont-wait --admission creator_only --name "Development stack"
        ona environment port open 8000 --dont-wait --admission creator_only --name "R engine"
        ona environment port open 9000 --dont-wait --admission creator_only --name "MinIO API"
        ona environment port open 9001 --dont-wait --admission creator_only --name "MinIO console"
        docker compose -f platform/docker-compose.dev.yml up -d --build postgres minio r-engine
        SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/refiq_db \
        SPRING_DATASOURCE_USERNAME=postgres \
        SPRING_DATASOURCE_PASSWORD=postgres \
        REFIQ_STORAGE_S3_ENDPOINT=http://localhost:9000 \
        REFIQ_STORAGE_S3_REGION=us-east-1 \
        REFIQ_STORAGE_S3_BUCKET_NAME=refiq-clinical-data-dev \
        AWS_ACCESS_KEY_ID=minioadmin \
        AWS_SECRET_ACCESS_KEY=minioadmin \
        PLUMBER_API_URL=http://localhost:8000 \
        SPRING_PROFILES_ACTIVE=dev \
        ./platform/mvnw -f platform/pom.xml spring-boot:run -Dspring-boot.run.arguments=--server.address=0.0.0.0
      ready: |
        curl -sf http://localhost:8080/actuator/health
      stop: |
        docker compose -f platform/docker-compose.dev.yml down
    triggeredBy:
      - manual
      - postEnvironmentStart
