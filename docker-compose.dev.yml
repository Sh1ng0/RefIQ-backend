version: '3.8'

services:
  app:
    build: .
    container_name: refiq-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://refiq-postgres:5432/refiq_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - REFIQ_STORAGE_S3_ENDPOINT=http://refiq-minio-dev:9000
      - REFIQ_STORAGE_S3_REGION=us-east-1
      - REFIQ_STORAGE_S3_BUCKET_NAME=refiq-clinical-data-dev
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - PLUMBER_API_URL=http://refiq-engine:8000
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - postgres
      - minio
      - r-engine

  postgres:
    image: postgres:15-alpine
    container_name: refiq-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=refiq_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: refiq-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_dev_data:/data

  r-engine:
    build: ./src/main/java/com/refiq/engine
    container_name: refiq-engine
    ports:
      - "8000:8000"
    volumes:
      - ./src/main/java/com/refiq/engine/api_plumber.R:/app/api_plumber.R

volumes:
  postgres_dev_data:
  minio_dev_data: