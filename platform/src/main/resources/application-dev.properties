# --- Configuracion PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/refiq_db
spring.datasource.username=postgres

# --- Secret stuff
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# --- Configuracion de Almacenamiento (S3 / LocalStack) ---
# Apuntamos al puerto estandar de LocalStack (4566)
refiq.storage.s3.endpoint=http://localhost:4566
refiq.storage.s3.region=us-east-1
refiq.storage.s3.bucket-name=refiq-clinical-data-dev

# Credenciales Dummy (LocalStack las acepta, pero el SDK de Java exige que existan)
aws.accessKeyId=test
aws.secretAccessKey=test



#Plumber
plumber.api.url=http://localhost:8000

management.endpoint.health.show-details=always

# --- Seguridad: JWT ---
# Debe ser una clave Base64 de al menos 256 bits (32 caracteres en crudo)
refiq.security.jwt.secret=ZmlybWFfc2VjcmV0YV9kZV9sYV9wbGF0YWZvcm1hX3JlZmlxX2VuX2Jhc2U2NA==
# Expiración: 15 minutos (900000 ms) - Manteniéndolo seguro
refiq.security.jwt.expiration-ms=900000

