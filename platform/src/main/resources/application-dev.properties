# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/refiq_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# --- Almacenamiento (MinIO Local) ---
refiq.storage.s3.endpoint=http://localhost:9000
refiq.storage.s3.region=us-east-1
refiq.storage.s3.bucket-name=refiq-clinical-data-dev
aws.accessKeyId=minioadmin
aws.secretAccessKey=minioadmin

# --- Motor R (Plumber) ---
plumber.api.url=http://localhost:8000

# --- Seguridad: JWT ---
refiq.security.jwt.secret=ZmlybWFfc2VjcmV0YV9kZV9sYV9wbGF0YWZvcm1hX3JlZmlxX2VuX2Jhc2U2NA==
refiq.security.jwt.expiration-ms=900000

# --- Spring Modulith ---
spring.modulith.events.republish-outstanding-events-on-restart=true
spring.modulith.events.completion-mode=archive
# --- Hikari CP ---
spring.datasource.hikari.leak-detection-threshold=2000
spring.datasource.hikari.max-lifetime=30000