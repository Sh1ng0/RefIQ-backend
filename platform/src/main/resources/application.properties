spring.application.name=RefIQ Platform

spring.profiles.active=dev


# --- Seguridad: Limites de Carga de Archivos (Multipart) ---
# Evita DoS por saturacion de disco/memoria.
# 50MB es suficiente para CSVs de >500k registros.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# --- Performance: Project Loom (Java 21) ---

# Convierte nuestro codigo bloqueante de S3 en codigo no-bloqueante para el OS.
spring.threads.virtual.enabled=true

# --- Default Region (Para que no falle al arrancar si se olvida configurar) ---
refiq.storage.s3.region=us-east-1