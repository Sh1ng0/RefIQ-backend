spring.application.name=RefIQ Platform

spring.profiles.active=dev


# --- Seguridad: Límites de Carga de Archivos (Multipart) ---
# Evita DoS por saturación de disco/memoria.
# 50MB es suficiente para CSVs de >500k registros.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# --- Performance: Project Loom (Java 21) ---

# Convierte nuestro código bloqueante de S3 en código no-bloqueante para el OS.
spring.threads.virtual.enabled=true