# Permitir que TestSecurityConfig gane la batalla
spring.main.allow-bean-definition-overriding=true

# --- MOCK S3 CONFIG ---
refiq.storage.s3.region=us-east-1
refiq.storage.s3.bucket-name=test-bucket
refiq.storage.s3.endpoint=http://localhost:4566
aws.accessKeyId=test
aws.secretAccessKey=test
# Wiremock
plumber.api.url=http://localhost:${wiremock.server.port}

# Si un test no define un DataSource (como Calculation), que no explote
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

#UNDER TESTING JWT PROVIDER CONFIG FOR TESTING
refiq.security.jwt.secret=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
refiq.security.jwt.expiration-ms=900000