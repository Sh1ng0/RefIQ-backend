# --- H2 for Testing ---
spring.datasource.url=jdbc:h2:mem:refiqdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop


# --- MOCK S3 CONFIG (LO QUE TE FALTA) ---
# Valores inventados para que el contexto de Spring no falle al arrancar
refiq.storage.s3.region=us-east-1
refiq.storage.s3.bucket-name=test-bucket
refiq.storage.s3.endpoint=http://localhost:4566
aws.access-key-id=test
aws.secret-access-key=test


# Wiremock testing url
plumber.api.url=http://localhost:${wiremock.server.port}