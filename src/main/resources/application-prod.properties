# --- PostgreSQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.show-sql=false

# --- Almacenamiento (MinIO Prod) ---
refiq.storage.s3.endpoint=${REFIQ_STORAGE_S3_ENDPOINT}
refiq.storage.s3.region=${REFIQ_STORAGE_S3_REGION}
refiq.storage.s3.bucket-name=${REFIQ_STORAGE_S3_BUCKET_NAME}
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}

# --- Motor R (Plumber) ---
plumber.api.url=${PLUMBER_API_URL}

# --- Seguridad: Nginx ---
server.forward-headers-strategy=framework

# --- Seguridad: JWT & CORS ---
refiq.security.jwt.secret=${REFIQ_SECURITY_JWT_SECRET}
refiq.security.cors.allowed-origins=${REFIQ_SECURITY_CORS_ALLOWED_ORIGINS}


# --- Seguridad: Data Lake API Key ---
refiq.datalake.api-key=${REFIQ_DATA_LAKE_API_KEY}

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true  

