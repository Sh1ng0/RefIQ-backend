# Allow TestSecurityConfig to override existing bean definitions
spring.main.allow-bean-definition-overriding=true

# --- MOCK S3 CONFIG ---
refiq.storage.s3.region=us-east-1
refiq.storage.s3.bucket-name=test-bucket
refiq.storage.s3.endpoint=http://localhost:4566
aws.accessKeyId=test
aws.secretAccessKey=test

# Wiremock
plumber.api.url=http://localhost:${wiremock.server.port}

# Fallback DataSource for slices that don't define one (e.g., Calculation)
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# JWT PROVIDER CONFIG FOR TESTING
refiq.security.jwt.secret=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
refiq.security.jwt.expiration-ms=900000

# If the listener fails, Modulith will retry publishing outstanding events on restart
spring.modulith.events.republish-outstanding-events-on-restart=true

# (Optional) Automatically clear completed events after a specific time
spring.modulith.events.completion-mode=archive

# Test key for the data lake
refiq.datalake.api-key=test-secret-key-123